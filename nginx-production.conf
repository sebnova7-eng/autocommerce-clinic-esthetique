# AutoCommerce Clinic — reverse proxy production public/private
#
# Modèle cible :
#   PUBLIC  app.autocommerce-clinic.com / pub.api.autocommerce-clinic.com
#           -> landing, fichiers statiques, /api/public et webhooks nécessaires
#   PRIVATE clinic.autocommerce-clinic.local / api.autocommerce-clinic.com
#           -> réseau clinique/VPN uniquement, application et /api/private
#
# PostgreSQL et Redis restent internes au réseau Docker et ne sont jamais publiés.
# Adapter la liste allow du réseau privé au CIDR VPN/réseau réel de la clinique.

server_tokens off;

# Redirection HTTP des surfaces publiques.
server {
    listen 80;
    listen [::]:80;
    server_name app.autocommerce-clinic.com pub.api.autocommerce-clinic.com;
    return 301 https://$host$request_uri;
}

# Le domaine privé ne doit pas être résolu publiquement. Cette redirection est
# utile uniquement lorsque le DNS privé/VPN atteint le reverse proxy.
server {
    listen 80;
    listen [::]:80;
    server_name clinic.autocommerce-clinic.local api.autocommerce-clinic.com;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    allow 127.0.0.1;
    allow ::1;
    deny all;
    return 301 https://$host$request_uri;
}

# ─────────────────────────────────────────────────────────────────────────────
# PUBLIC FRONTEND : aucune route clinique API ne traverse cette surface.
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.autocommerce-clinic.com;

    ssl_certificate     /etc/letsencrypt/live/app.autocommerce-clinic.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.autocommerce-clinic.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 25m;
    client_header_timeout 15s;
    client_body_timeout 60s;
    send_timeout 60s;

    # Public Gateway uniquement.
    location ^~ /api/public/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    location ^~ /api/private/ { return 404; }
    location ^~ /api/v1/ { return 404; }
    location ^~ /webhook/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# PUBLIC API : aucune route privée ou historique ne traverse ce domaine.
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pub.api.autocommerce-clinic.com;

    ssl_certificate     /etc/letsencrypt/live/pub.api.autocommerce-clinic.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pub.api.autocommerce-clinic.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location ^~ /api/public/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    location ^~ /api/private/ { return 404; }
    location ^~ /api/v1/ { return 404; }
    location / { return 404; }
}

# ─────────────────────────────────────────────────────────────────────────────
# PRIVATE FRONTEND : réseau clinique/VPN uniquement.
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name clinic.autocommerce-clinic.local;

    ssl_certificate     /etc/autocommerce/tls/clinic.fullchain.pem;
    ssl_certificate_key /etc/autocommerce/tls/clinic.privkey.pem;
    include /etc/nginx/snippets/autocommerce-private-tls.conf;

    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    allow 127.0.0.1;
    allow ::1;
    deny all;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location ^~ /api/private/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # Compatibilité historique seulement depuis le réseau privé.
    location ^~ /api/v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    location ^~ /api/public/ { return 404; }
    location ^~ /webhook/ { return 404; }
    location = /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        access_log off;
    }
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}

