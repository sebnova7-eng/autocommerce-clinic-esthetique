# Paramètres TLS privés pour clinic.autocommerce-clinic.local et api.autocommerce-clinic.com.
# Remplacer les chemins de certificats dans nginx-production.conf par les certificats
# émis par la PKI interne ou le gestionnaire TLS de la clinique.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:PRIVATE:10m;
ssl_session_timeout 10m;
add_header X-Content-Type-Options "nosniff" always;
