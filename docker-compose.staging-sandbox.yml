# Override uniquement pour la validation locale dans une sandbox dont iptables
# ne permet pas le réseau bridge inter-conteneurs. Ne pas utiliser en production.
services:
  postgres:
    network_mode: host
    networks: !reset []
    ports: !reset []
  redis:
    network_mode: host
    networks: !reset []
    ports: !reset []
  api:
    network_mode: host
    networks: !reset []
    env_file: !override
      - /home/ubuntu/staging-secrets/api.sandbox.env
    ports: !reset []
  worker:
    network_mode: host
    networks: !reset []
    env_file: !override
      - /home/ubuntu/staging-secrets/api.sandbox.env
  beat:
    network_mode: host
    networks: !reset []
    env_file: !override
      - /home/ubuntu/staging-secrets/api.sandbox.env
  web:
    network_mode: host
    networks: !reset []
    ports: !reset []
    volumes:
      - ./autocommerce-app/nginx.staging.conf:/etc/nginx/conf.d/default.conf:ro
networks: !reset []
